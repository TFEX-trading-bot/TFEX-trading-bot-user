<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">
    <aside class="sidebar">
         </aside>

    <main class="main-content">
        <header class="main-header">
            <h2>Profile</h2>
            <div class="user-profile">
                 </div>
        </header>
        
        <div class="profile-container">
            <div class="profile-header">
                <div class="profile-avatar">
                    <img src="https://i.pravatar.cc/80?u=cornellia" alt="User Avatar">
                    <button class="upload-btn">Select User Photo</button>
                </div>
                <div class="profile-info">
                    <h4>Cornellia Hubbert</h4>
                    <p>cornellia.h@email.com</p>
                </div>
                <button class="btn btn-secondary">Update</button>
            </div>

            <div class="profile-form-section">
                <h3>Change User Information Here</h3>
                <form>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Fullname</label>
                            <input type="text" value="Cornellia Hubbert">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" value="cornellia.h@email.com">
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="text">
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" placeholder="Enter new password">
                        </div>
                    </div>
                     <div class="form-actions">
                        <button type="button" class="btn btn-secondary">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
